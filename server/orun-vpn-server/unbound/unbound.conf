server:
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  access-control: 10.8.0.0/24 allow
  hide-identity: yes
  hide-version: yes
  # Container roda como root (precisa escrever o sidecar da zone RPZ no
  # volume host-mountado). Chroot desligado — não é um multiusuário.
  username: ""
  chroot: ""
  # Módulo respip é OBRIGATÓRIO para o RPZ (Response Policy Zone) funcionar.
  # Sem ele, o bloco `rpz:` não é ativado na cadeia de módulos.
  module-config: "respip validator iterator"
  # DNS-over-TLS pro upstream — não vaza consultas em plaintext
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 1.0.0.1@853#cloudflare-dns.com

# Blocklist via RPZ (Response Policy Zone) — mecanismo nativo do Unbound
# desde a 1.16, não um "include" de lista solta. Fonte real confirmada:
# https://github.com/hagezi/dns-blocklists/blob/main/rpz/pro.txt
#
# Imagem custom (Dockerfile no mesmo dir): o unbound da imagem `mvance`
# NÃO tem `--enable-rpz` e morre silenciosamente com o bloco `rpz:` na config.
# Este build próprio é compilado com --enable-rpz (confirmado com unbound -V).
rpz:
  name: "hagezi.pro.rpz"
  zonefile: "/opt/unbound/etc/unbound/hagezi-pro.rpz"
  rpz-log: yes
